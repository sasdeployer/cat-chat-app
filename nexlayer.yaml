application:
  name: "cat-chat-app"
  pods:
    # Frontend - React app with Nginx reverse proxy
    - name: "frontend"
      image: "registry.nexlayer.io/user_01kdnssb5ktgqr1mawtnz48s00/cat-chat-app-frontend:d4e11c3"
      path: "/"
      servicePorts: [80]

    # Backend - Node.js + Express + Socket.io server
    - name: "backend"
      image: "registry.nexlayer.io/nexlayer-mcp/nexlayer/cat-chat-backend:f51be2b"
      servicePorts: [3001]
      vars:
        PORT: "3001"
        DB_HOST: "database.pod"
        DB_PORT: "5432"
        DB_NAME: "catchat"
        DB_USER: "postgres"
        DB_PASSWORD: ${POSTGRES_PASSWORD}
        CLIENT_URL: "<% URL %>"

    # Database - PostgreSQL 15
    - name: "database"
      image: "registry.nexlayer.io/nexlayer-mcp/nexlayer/cat-chat-database:f51be2b"
      servicePorts: [5432]
      vars:
        POSTGRES_DB: "catchat"
        POSTGRES_USER: "postgres"
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        PGDATA: "/var/lib/postgresql/data"
      volumes:
        - name: "postgres-data"
          size: "2Gi"
          mountPath: "/var/lib/postgresql"
